ReleaseNotes: |-
  A new installation signs you in automatically (single-user mode), a filter finds any connection as you type (Ctrl+F), the login screen is redesigned with a language menu, Black replaces Dark, tips appear in the empty overview, and the Pro licence is gone: everything is free and open source.
